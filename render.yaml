services:
  - type: web
    name: webvitals-security-platform
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: AI_ENABLED
        value: "true"
      - key: GOOGLE_CLOUD_API_KEY
        sync: false
